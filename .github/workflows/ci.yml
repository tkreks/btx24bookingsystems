name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: btx24
          MARIADB_USER: btx24
          MARIADB_PASSWORD: ci
          MARIADB_ROOT_PASSWORD: ci-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: mysql://btx24:ci@127.0.0.1:3306/btx24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Migrations apply on a clean database
        run: npm run prisma:deploy -w @btx24/api
      - name: Docker images build
        run: |
          docker build --target api -t btx24booking-api:ci .
          docker build --target web -t btx24booking-web:ci .
