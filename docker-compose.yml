# Стенд: db (MariaDB) + api (NestJS) + worker (фоновые задачи) + web (nginx + фронтенд).
# Запуск: cp .env.example .env && (заполнить пароли) && docker compose up -d --build
# Снаружи — Nginx Proxy Manager → web (порт APP_HOST_PORT), см. docs/deploy.md.
name: btx24booking

x-api-env: &api-env
  NODE_ENV: production
  TZ: UTC
  DATABASE_URL: mysql://${DB_USER:-btx24}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:3306/${DB_NAME:-btx24}
  APP_BASE_URL: ${APP_BASE_URL:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 32)}
  B24_CLIENT_ID: ${B24_CLIENT_ID:-}
  B24_CLIENT_SECRET: ${B24_CLIENT_SECRET:-}
  B24_TRUSTED_OAUTH_HOSTS: ${B24_TRUSTED_OAUTH_HOSTS:-oauth.bitrix.info,oauth.bitrix24.tech}
  # Только чтение данных портала, пока изменения не разрешены владельцем явно.
  B24_READ_ONLY: ${B24_READ_ONLY:-true}
  # Песочница записи при B24_READ_ONLY=true: сделки и период броней, где изменения разрешены.
  B24_SANDBOX_DEAL_IDS: ${B24_SANDBOX_DEAL_IDS:-}
  B24_SANDBOX_BOOKINGS_FROM: ${B24_SANDBOX_BOOKINGS_FROM:-}
  B24_SANDBOX_BOOKINGS_TO: ${B24_SANDBOX_BOOKINGS_TO:-}
  # Сервис мессенджеров (ADR 0014): только внутренняя сеть стенда; токен — общий с messenger.
  MESSENGER_URL: ${MESSENGER_URL:-http://messenger:3090}
  MESSENGER_TOKEN: ${MESSENGER_TOKEN:-}

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MARIADB_DATABASE: ${DB_NAME:-btx24}
      MARIADB_USER: ${DB_USER:-btx24}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      # Пароль read-only пользователя agent_ro для MCP-сервера (db_schema / db_query).
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-}
      TZ: UTC
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Только localhost: разработка на хосте и MCP-сервер, не наружу.
      - "127.0.0.1:${DB_HOST_PORT:-53306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      target: api
    image: btx24booking-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
    # Наружу не публикуется: снаружи доступен только через web.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(j=>process.exit(j.status==='ok'?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5

  worker:
    image: btx24booking-api:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *api-env
      SKIP_MIGRATIONS: "1"
    command: ["node", "dist/worker.js"]
    healthcheck:
      # Пульс пишется каждые 15 с; старше 60 с — процесс завис.
      test: ["CMD", "node", "-e", "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/worker-heartbeat','utf8'))<60000?0:1)"]
      interval: 20s
      timeout: 3s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      target: web
    image: btx24booking-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_HOST_BIND:-0.0.0.0}:${APP_HOST_PORT:-3080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  # Браузеры мессенджеров (WhatsApp Web) и их экраны по VNC. Наружу не публикуется: только api.
  messenger:
    build:
      context: .
      target: messenger
    image: btx24booking-messenger:local
    restart: unless-stopped
    environment:
      TZ: UTC
      MESSENGER_TOKEN: ${MESSENGER_TOKEN:-}
      # WhatsApp и Telegram с сервера напрямую недоступны — через HTTP-прокси (владелец, 2026-10-24).
      MESSENGER_PROXY: ${MESSENGER_PROXY:-http://62.233.57.133:1081}
    volumes:
      - messenger-data:/data
    # Chromium нужна общая память больше стандартных 64 МБ.
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  mariadb-data:
  # Сессии мессенджеров: после перезапуска вход не нужен. Удаление тома = выход из всех аккаунтов.
  messenger-data:
