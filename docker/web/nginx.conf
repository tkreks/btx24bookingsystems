# Контейнер web: отдаёт собранный фронтенд и проксирует /api в контейнер api.
# Снаружи перед ним стоит Nginx Proxy Manager (TLS), см. docs/deploy.md.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    # Битрикс24 встраивает приложение в iframe: X-Frame-Options / frame-ancestors не ставим.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Протокол берём от внешнего прокси (NPM), иначе — свой.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Хешированные ассеты Vite — долгий кэш.
    location /assets/ {
        expires 1y;
        # add_header в location отменяет унаследованные — повторяем общие заголовки.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Портал открывает обработчик («Путь вашего обработчика» = /) POST-запросом с токенами фрейма.
    # Отдаём его api: при необходимости он зарегистрирует портал и ответит 303 на SPA.
    location = / {
        if ($request_method = POST) {
            rewrite ^ /api/b24/app last;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files /index.html =404;
    }

    # Остальные пути SPA; POST на них (встройки) отдаёт index.html.
    location / {
        error_page 405 =200 /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
