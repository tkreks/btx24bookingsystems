# Контейнер web: отдаёт собранный фронтенд и проксирует /api в контейнер api.
# Снаружи перед ним стоит Nginx Proxy Manager (TLS), см. docs/deploy.md.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    # Переадресации — относительные: снаружи https и другой порт (Nginx Proxy Manager).
    absolute_redirect off;

    # Битрикс24 встраивает приложение в iframe: X-Frame-Options / frame-ancestors не ставим.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Протокол берём от внешнего прокси (NPM), иначе — свой.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Один файл до 64 МБ плюс multipart-поля; остальные API сохраняют лимит 10m.
    location ~ ^/api/(admin/)?messengers/[^/]+/send-file$ {
        client_max_body_size 70m;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # События сервиса мессенджеров — только внутри стенда (сервис ходит в api напрямую), снаружи закрыто.
    location = /api/messengers/hook {
        return 404;
    }

    # Экран мессенджера по VNC (ADR 0014): WebSocket до api, тот проверяет билет администратора.
    location = /api/messengers/vnc {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Хешированные ассеты Vite — долгий кэш.
    location /assets/ {
        expires 1y;
        # add_header в location отменяет унаследованные — повторяем общие заголовки.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Портал открывает обработчик («Путь вашего обработчика» = /) POST-запросом с токенами фрейма.
    # Отдаём его api: при необходимости он зарегистрирует портал и ответит 303 на SPA.
    location = / {
        if ($request_method = POST) {
            rewrite ^ /api/b24/app last;
        }
        # Вход вне портала: облако возвращает сотрудника не на redirect_uri, а на адрес обработчика
        # (`/?code=…&state=…`). state у нас — `{portalId}.{48 hex}`; браузер переводим на обработчик
        # входа (302, а не rewrite: cookie state ограничена путём /api/auth).
        if ($arg_state ~ "^[A-Za-z0-9_-]+\.[0-9a-f]{48}$") {
            return 302 /api/auth/callback?$args;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files /index.html =404;
    }

    # Остальные пути SPA; POST на них (встройки) отдаёт index.html.
    location / {
        error_page 405 =200 /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
