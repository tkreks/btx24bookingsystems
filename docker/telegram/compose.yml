# Контейнер Telegram Web — отдельный файл, чтобы не трогать общий docker-compose.yml, пока сервис
# не подключён к приложению. Запуск из корня репозитория:
#   docker compose -f docker-compose.yml -f docker/telegram/compose.yml up -d --build telegram
# Пути относительно корня (первый -f задаёт каталог проекта).
services:
  telegram:
    build:
      context: .
      dockerfile: docker/telegram/Dockerfile
    image: btx24booking-telegram:local
    restart: unless-stopped
    environment:
      TZ: UTC
      # Тот же прокси, что у WhatsApp (владелец, 2026-10-24).
      MESSENGER_PROXY: ${MESSENGER_PROXY:-http://62.233.57.133:1081}
      TG_VNC_PASSWORD: ${TG_VNC_PASSWORD:-}
    volumes:
      - telegram-data:/data
    # Chromium нужна общая память больше стандартных 64 МБ.
    shm_size: 1gb
    # Экран — по умолчанию только localhost хоста; TG_VNC_HOST_BIND=<IP в локальной сети> — из LAN.
    ports:
      - "${TG_VNC_HOST_BIND:-127.0.0.1}:${TG_VNC_HOST_PORT:-56080}:6080"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x Xvfb >/dev/null && pgrep -x x11vnc >/dev/null && pgrep -f websockify >/dev/null && pgrep -x chromium >/dev/null"]
      interval: 20s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  # Сессия Telegram Web. Удаление тома = выход из аккаунта.
  telegram-data:
